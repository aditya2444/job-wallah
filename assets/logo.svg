<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60" fill="none">
  <!-- Icon symbol: Briefcase & Career Rocket / Grad Cap motif -->
  <g transform="translate(6, 6)">
    <rect x="2" y="10" width="38" height="30" rx="8" fill="#008BDC" />
    <path d="M14 10V7C14 4.79086 15.7909 3 18 3H24C26.2091 3 28 4.79086 28 7V10" stroke="#005B94" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Diagonal highlight band -->
    <path d="M2 24C12 28 30 28 40 24" stroke="white" stroke-width="2" stroke-opacity="0.6"/>
    <!-- Center badge lock / sparkle -->
    <circle cx="21" cy="24" r="4.5" fill="#FFB703" stroke="#FFFFFF" stroke-width="1.5"/>
    <!-- Growth arrow upward right -->
    <path d="M30 6L39 6L39 15" stroke="#FFB703" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M39 6L28 17" stroke="#FFB703" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <!-- "JOB" -->
  <text x="58" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="900" font-size="28" fill="#1C2D42" letter-spacing="-0.5">JOB</text>
  <!-- "WALLAH" -->
  <text x="120" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="800" font-size="28" fill="#008BDC" letter-spacing="-0.5">WALLAH</text>
  
  <!-- Subtle Tagline -->
  <text x="59" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="600" font-size="8.5" fill="#6B7280" letter-spacing="1.8">INTERNSHIPS &amp; JOBS</text>
</svg>
